plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"merryevents" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			client()
			configName = "Minecraft Client 1"
			ideConfigGenerated = true
			runDir = "run"
			vmArgs "-Xms128M", "-Xmx1G"
			programArgs "--username", "DevPlayer1"
		}
		client2 {
			client()
			configName = "Minecraft Client 2"
			ideConfigGenerated = true
			runDir = "run-client2"
			vmArgs "-Xms128M", "-Xmx1G"
			programArgs "--username", "DevPlayer2"
		}
		clientSodium {
			client()
			configName = "Minecraft Client (Sodium)"
			ideConfigGenerated = true
			runDir = "run"
			vmArgs "-Xms256M", "-Xmx2G"
			programArgs "--username", "DevSodium"
		}
		clientIris {
			client()
			configName = "Minecraft Client (Sodium + Iris)"
			ideConfigGenerated = true
			runDir = "run"
			vmArgs "-Xms512M", "-Xmx2G"
			programArgs "--username", "DevIris"
		}
		server {
			server()
			configName = "Minecraft Server"
			ideConfigGenerated = true
			runDir = "run-server"
			vmArgs "-Xms128M", "-Xmx1G"
			programArgs "nogui"
		}
	}
}

def lowMemoryClientOptions = [
	renderDistance: "5",
	simulationDistance: "5",
	graphicsMode: "0",
	clouds: "0",
	particles: "2",
	entityShadows: "false",
	entityDistanceScaling: "0.5",
	biomeBlendRadius: "0",
	mipmapLevels: "0",
	maxFps: "60",
	vsync: "false"
]

def configureLowMemoryClient = { String optionsFilePath ->
	def optionsFile = new File(optionsFilePath)
	def lines = optionsFile.exists() ? optionsFile.readLines("UTF-8") : []

	lowMemoryClientOptions.each { key, value ->
		def index = lines.findIndexOf { it.startsWith("${key}:") }
		if (index >= 0) {
			lines[index] = "${key}:${value}"
		} else {
			lines.add("${key}:${value}")
		}
	}

	optionsFile.parentFile.mkdirs()
	optionsFile.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), "UTF-8")
}

tasks.register("configureLowMemoryClient1") {
	def optionsFilePath = layout.projectDirectory.file("run/options.txt").asFile.absolutePath
	doLast {
		configureLowMemoryClient(optionsFilePath)
	}
}

tasks.register("configureLowMemoryClient2") {
	def optionsFilePath = layout.projectDirectory.file("run-client2/options.txt").asFile.absolutePath
	doLast {
		configureLowMemoryClient(optionsFilePath)
	}
}

tasks.named("runClient") {
	dependsOn("configureLowMemoryClient1")
}

tasks.named("runClient2") {
	dependsOn("configureLowMemoryClient2")
}

tasks.named("runClientSodium") {
	dependsOn("configureLowMemoryClient1")
}

tasks.named("runClientIris") {
	dependsOn("configureLowMemoryClient1")
}

tasks.register("acceptEula") {
	def eulaFile = layout.projectDirectory.file("run-server/eula.txt").asFile
	outputs.file(eulaFile)

	doLast {
		if (!eulaFile.exists()) {
			eulaFile.parentFile.mkdirs()
			eulaFile.text = "eula=true\n"
		}
	}
}

tasks.register("configureLocalDevServer") {
	def propertiesFile = layout.projectDirectory.file("run-server/server.properties").asFile
	outputs.file(propertiesFile)

	doLast {
		def properties = propertiesFile.exists() ? propertiesFile.readLines("UTF-8") : []
		[
			"online-mode": "false",
			"enforce-secure-profile": "false",
			"server-ip": "127.0.0.1"
		].each { key, value ->
			def index = properties.findIndexOf { it.startsWith("${key}=") }
			if (index >= 0) {
				properties[index] = "${key}=${value}"
			} else {
				properties.add("${key}=${value}")
			}
		}

		propertiesFile.parentFile.mkdirs()
		propertiesFile.setText(properties.join(System.lineSeparator()) + System.lineSeparator(), "UTF-8")
	}
}

tasks.named("runServer") {
	dependsOn("acceptEula", "configureLocalDevServer")
}

def isSodiumRequested = project.hasProperty("withSodium") || gradle.startParameter.taskNames.any {
	it.toLowerCase().contains("sodium") || it.toLowerCase().contains("iris")
}
def isIrisRequested = project.hasProperty("withIris") || gradle.startParameter.taskNames.any {
	it.toLowerCase().contains("iris")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Isolated runtime rendering mods for standalone dev testing
	if (isSodiumRequested) {
		modLocalRuntime "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
	}
	if (isIrisRequested) {
		modLocalRuntime "maven.modrinth:iris:1.8.8+1.21.1-fabric"
		runtimeOnly "org.anarres:jcpp:1.4.14"
		runtimeOnly "io.github.douira:glsl-transformer:2.0.1"
		runtimeOnly "org.antlr:antlr4-runtime:4.13.1"
	}

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

apply from: 'gradle/localization.gradle'

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.named("remapJar", net.fabricmc.loom.task.RemapJarTask) {
	archiveClassifier.set("")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}